name: Verify and deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run format
      - run: npm test
      - run: npm run test:browser -- --project=chromium
      - run: npm run build
        env:
          VITE_ADSENSE_CLIENT: ${{ secrets.VITE_ADSENSE_CLIENT || secrets.ADSENSE_CLIENT || vars.VITE_ADSENSE_CLIENT || vars.ADSENSE_CLIENT }}
          VITE_CLOUDFLARE_ANALYTICS_TOKEN: ${{ secrets.VITE_CLOUDFLARE_ANALYTICS_TOKEN || secrets.CLOUDFLARE_ANALYTICS_TOKEN || vars.VITE_CLOUDFLARE_ANALYTICS_TOKEN || vars.CLOUDFLARE_ANALYTICS_TOKEN }}
          VITE_PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
      - name: Verify advertising and analytics snippets
        if: github.event_name != 'pull_request'
        run: |
          grep -F 'pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=' dist/index.html
          grep -F 'static.cloudflareinsights.com/beacon.min.js' dist/index.html
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: verify
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
